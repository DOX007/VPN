<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemwebbläsare</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #1e1e24; color: #eee; }
  body { display: flex; flex-direction: column; }
  form { display: flex; gap: 4px; padding: 4px; background: #2b2b33; }
  button, input { font-size: 13px; border-radius: 4px; border: 1px solid #444; background: #3a3a44; color: #eee; padding: 5px 8px; }
  button { cursor: pointer; }
  #addr { flex: 1; min-width: 0; }
  #status { padding: 2px 8px; font-size: 11px; color: #aaa; background: #25252c; min-height: 16px; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  #help { padding: 16px; max-width: 640px; }
</style>
</head>
<body>
<form id="form">
  <input id="addr" type="text" placeholder="Adress till din hemwebbläsare, t.ex. surf.dindomän.se" autocomplete="off" autofocus>
  <button type="submit">Anslut</button>
  <button type="button" id="tab" title="Öppna i egen flik">↗</button>
</form>
<div id="status">Ej ansluten</div>
<div id="help">
  <p>Ange adressen till din hemserver (Chromium bakom en Cloudflare Tunnel). Adressen sparas i den här webbläsaren.</p>
  <p>Om sidan inte visas i ramen har tjänsten blockerat inbäddning. Använd då knappen ↗.</p>
</div>
<iframe id="view" title="Hemwebbläsare" hidden allow="clipboard-read; clipboard-write; fullscreen"></iframe>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const addr = $('addr'), view = $('view'), status = $('status'), help = $('help');
  const KEY = 'homeBrowserHost';

  function toUrl(input) {
    input = input.trim();
    if (!input) return null;
    try {
      const url = new URL(/^https:\/\//i.test(input) ? input : 'https://' + input.replace(/^http:\/\//i, ''));
      return url.username || url.password ? null : url.href;
    } catch {
      return null;
    }
  }

  function connect() {
    const url = toUrl(addr.value);
    if (!url) { status.textContent = 'Ogiltig adress.'; return; }
    localStorage.setItem(KEY, addr.value.trim());
    view.src = url;
    view.hidden = false;
    help.hidden = true;
    status.textContent = 'Ansluten till ' + new URL(url).host;
  }

  $('form').addEventListener('submit', e => { e.preventDefault(); connect(); });
  $('tab').onclick = () => {
    const url = toUrl(addr.value);
    if (url) window.open(url, '_blank', 'noopener');
  };

  const saved = localStorage.getItem(KEY);
  if (saved) addr.value = saved;
})();
</script>
</body>
</html>
